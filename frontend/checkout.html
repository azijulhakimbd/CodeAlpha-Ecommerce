<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — NovaCart</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="header"><a class="brand" href="/"><span>✦</span> NovaCart</a><nav><a href="/cart.html">← Cart</a></nav></header>
<main class="section"><span class="eyebrow">CHECKOUT</span><h1>Complete your order</h1><div class="checkout-grid"><form id="checkoutForm" class="form-card"><label>Full name<input name="fullName" required></label><label>Phone<input name="phone" required></label><label>Address<textarea name="address" required rows="3"></textarea></label><div class="two"><label>City<input name="city" required></label><label>Postal code<input name="postalCode" required></label></div><button class="btn primary full">Place order</button><div id="checkoutError" class="error"></div></form><div id="checkoutSummary" class="summary"></div></div></main>
<script src="/js/app.js"></script>
</body>
</html>
